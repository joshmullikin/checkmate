[project]
name = "checkmate"
version = "0.5.1"
description = "AI-powered QA testing agent with natural language test execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3.24",
    "langgraph>=0.4.8",
    "langgraph-cli[inmem]>=0.4.30",
    "langchain-mcp-adapters>=0.1.0",
    "sqlmodel>=0.0.38",
    "aiosqlite>=0.22.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.49.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "apscheduler>=3.10.0",
    "croniter>=2.0.0",
    "pytz>=2024.1",
    "tzdata>=2024.1",
    "cachetools>=5.3.0",
    "websockets>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "db", "api"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent", "api", "core", "db", "scheduler"]
omit = ["tests/*"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
